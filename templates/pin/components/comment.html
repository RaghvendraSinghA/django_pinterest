<div class="comment-thread {% if level != 0 %}nested-thread{% endif %}">

    <div class="comment">

        <strong class="commenter-name">
            {{ comment.user.username }} :
        </strong>

        <!-- <p class="commenter-text">
            {{ comment.text }}
        </p> -->

        <p class="commenter-text" {% if request.user == comment.user %}
            data-edit-url="{% url 'edit_comment' comment.id %}" {% endif %}>
            {{ comment.text }}
        </p>

        <div class="comment-actions">

            <form method="POST" action="{% url 'add_reply' pin.id comment.id %}" class="reply-form">
                {% csrf_token %}

                <textarea name="text" placeholder="Reply..." rows="2" class="reply-textarea"></textarea>

                <button class="reply-btn" type="submit">
                    Reply
                </button>

            </form>


            {% if request.user == comment.user %}

            <form method="POST" action="{% url 'delete_comment' comment.id %}" class="delete-comment-form">
                {% csrf_token %}

                <button class="reply-delete" type="submit">
                    Delete
                </button>

            </form>

            {% endif %}

        </div>

    </div>


    <div class="current-comment-replies">
        {% for reply in comment.replies.all %}
        {% include "pin/components/comment.html" with comment=reply level=1 %}
        {% endfor %}
    </div>


</div>
