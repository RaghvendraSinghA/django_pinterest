{% extends "base.html" %}
{% load static %}

{% block title %}
    Create Pin
{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'pin/css/create_pin.css' %}">

<div class="create-pin-page">

    <div class="create-pin-card">

        <h1>Create Pin</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Pin
            </button>

        </form>

    </div>

</div>

{% endblock %}
