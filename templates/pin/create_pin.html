{% extends "base.html" %}
{% load static %}

{% block title %}
Create Pin
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'pin/css/create_pin.css' %}">
{% endblock extra_css %}

{% block content %}



<div class="create-pin-page">

    <div class="create-pin-card">

        <h1>Create Pin</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <div>
                <label for="image">Upload Image</label>
                <input type="file" name="image" id="image" accept="image/*" required>
            </div>

            <button type="submit">
                Create Pin
            </button>

        </form>

    </div>

</div>

{% endblock %}
