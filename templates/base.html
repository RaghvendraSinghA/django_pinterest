{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Pinterest{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">


    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-top">

                <a href="{% url 'home' %}" class="sidebar-logo">
                    <!-- <div class="logo">
                        Pinterest
                    </div> -->

                    <img class="logo pin-logo" src="{% static 'images/pinterest.png' %}" alt="Pinterest">

                </a>

                <nav class="sidebar-navigation">

                    <a href="{% url 'home' %}">
                        <!-- Home -->
                        <img class="logo" src="{% static 'images/home.png' %}" alt="Pinterest">
                    </a>

                    <a href="#">
                        <!-- Explore -->
                        <img class="logo" src="{% static 'images/explore.png' %}" alt="Pinterest">
                    </a>

                    <a href="#">
                        <!-- Boards -->
                        <img class="logo" src="{% static 'images/boards.png' %}" alt="Pinterest">
                    </a>

                    <button type="button" id="create-button">
                        <!-- Create -->
                        <img class="logo" src="{% static 'images/add.png' %}" alt="Pinterest">
                    </button>

                    <button type="button">
                        <!-- Notifications -->
                        <img class="logo" src="{% static 'images/notification.png' %}" alt="Pinterest">
                    </button>

                    <button type="button">
                        <!-- Messages -->
                        <img class="logo message" src="{% static 'images/messenge.png' %}" alt="Pinterest">
                    </button>

                </nav>

            </div>

            <div class="sidebar-bottom">
                <!-- <button type="button">Settings</button> -->
                 <img class="logo" src="{% static 'images/setting.png' %}" alt="setting">
            </div>

        </aside>


        <!-- SLIDER -->
        <aside class="slider">

            <!-- Create Slider -->
            <div class="slider-panel create-panel" id="create-panel">

                <h2>Create</h2>

                <button type="button" id="create-pin-button" onclick="window.location.href='{% url 'create_pin' %}'">
                    Pin
                </button>

                <button type="button">
                    Collage
                </button>

                <button type="button">
                    Board
                </button>

            </div>


            <!-- Messages Slider -->
            <div class="slider-panel messages-panel">

                <h2>Messages</h2>

                <!-- Messages will come later -->

            </div>


            <!-- Notifications Slider -->
            <div class="slider-panel notifications-panel">

                <h2>Notifications</h2>

                <!-- Notifications will come later -->

            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <!-- HEADER -->
            <header class="header">

                <div class="search-wrapper">

                    <div class="search-bar">

                        <span class="search-icon">🔍</span>

                        <span class="search-placeholder">
                            Search
                        </span>

                    </div>

                    <div class="search-panel">

                        <h3>Recommended</h3>

                        <button type="button">
                            🔍 Fashion
                        </button>

                        <button type="button">
                            🔍 Home decor
                        </button>

                        <button type="button">
                            🔍 Travel
                        </button>

                        <button type="button">
                            🔍 Photography
                        </button>

                    </div>

                </div>

                <button type="button" class="profile">
                    {% if request.user.is_authenticated %}
                    {{ request.user.username }}
                    {% else %}
                    Guest
                    {% endif %}
                </button>

                <button type="button" class="logout" onclick="window.location.href='{% url 'logout' %}'">
                    Logout
                </button>

            </header>


            <!-- PAGE CONTENT -->
            <section class="content">

                {% block content %}
                {% endblock %}

            </section>

        </main>

    </div>

    <script src="{% static 'home/js/script.js' %}"></script>

</body>

</html>
