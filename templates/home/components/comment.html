<div
    class="comment-thread {% if level != 0 %}nested-thread{% endif %}"
    style="margin-left: {{ level }}px;"
>

    <div class="comment">

        <strong class="commenter-name">
            {{ comment.user.username }} :
        </strong>

        <p class="commenter-text">
            {{ comment.text }}
        </p>

        <div class="comment-actions">

            <form
                method="POST"
                action="{% url 'add_reply' pin.id comment.id %}"
                class="reply-form"
            >
                {% csrf_token %}

                <textarea
                    name="text"
                    placeholder="Reply..."
                    rows="2"
                    class="reply-textarea"
                ></textarea>

                <button class="reply-btn" type="submit">
                    Reply
                </button>

            </form>


            {% if request.user == comment.user %}

                <form
                    method="POST"
                    action="{% url 'delete_comment' comment.id %}"
                    class="delete-comment-form"
                >
                    {% csrf_token %}

                    <button class="reply-delete" type="submit">
                        Delete
                    </button>

                </form>

            {% endif %}

        </div>

    </div>


    {% for reply in comment.replies.all %}

        {% include "home/components/comment.html" with comment=reply level=level|add:"28" %}

    {% endfor %}

</div>
