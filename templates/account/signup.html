{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up</title>

    <link
        rel="stylesheet"
        href="{% static 'account/css/auth.css' %}"
    >

</head>

<body>

<div class="auth-container">

    <h1>Create account</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Sign Up
        </button>

    </form>

    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

<script src="{% static 'account/js/auth.js' %}"></script>

</body>

</html>
